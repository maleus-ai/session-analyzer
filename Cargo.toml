[package]
name = "session-analyzer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ssa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
unicode-width = "0.2"
rayon = "1"

[profile.release]
opt-level = 3
lto = true

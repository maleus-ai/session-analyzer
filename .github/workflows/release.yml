name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Leave empty for an artifact-only build."
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every job runs on Blacksmith, matching kepler-master. Linux aarch64 builds
          # natively on an -arm runner rather than cross-compiling from x86.
          - target: x86_64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2204
          - target: x86_64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2204
            musl: true
          - target: aarch64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2204-arm
          - target: aarch64-unknown-linux-musl
            runner: blacksmith-4vcpu-ubuntu-2204-arm
            musl: true
          # Blacksmith macOS is Apple Silicon (M4/ARM64) only — build aarch64 natively and
          # cross-compile the x86_64 binary on the same runner (Apple's toolchain + pure-Rust
          # deps make this a no-op beyond `rustup target add`).
          - target: aarch64-apple-darwin
            runner: blacksmith-6vcpu-macos-15
          - target: x86_64-apple-darwin
            runner: blacksmith-6vcpu-macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: ${{ matrix.musl }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build ssa
        run: cargo build --release --target ${{ matrix.target }} --bin ssa

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package tarball
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGING="ssa-${VERSION}"
          TARBALL="ssa-${VERSION}-${TARGET}.tar.gz"

          mkdir -p "$STAGING"
          cp "target/${TARGET}/release/ssa" "$STAGING/"
          cp install.sh "$STAGING/"
          cp README.md "$STAGING/" 2>/dev/null || true

          tar czf "$TARBALL" "$STAGING"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARBALL }}
          path: ${{ env.TARBALL }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List tarballs
        run: ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
